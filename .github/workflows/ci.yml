name: TerraFlux CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: pip install -r intelligence/requirements.txt

      - name: Install image libraries
        run: sudo apt-get update && sudo apt-get install -y libpng-dev libjpeg-dev

      - name: Build native engine
        run: |
          cmake -S native-compute -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2

      - name: Run native grid tests
        run: ctest --test-dir build --output-on-failure

      - name: Run Python tests
        env:
          PYTHONPATH: intelligence
        run: python -m unittest discover -s intelligence/tests -v

      - name: Verify native parity
        env:
          PYTHONPATH: intelligence
        run: |
          python intelligence/scripts/verify_native_parity.py \
            --runner build/terraflux-compute-runner \
            --fixtures intelligence/tests/fixtures/grid_spread_cases.json

  clang-debug-native:
    name: Clang Debug and parity
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: pip install -r intelligence/requirements.txt

      - name: Install image libraries
        run: sudo apt-get update && sudo apt-get install -y libpng-dev libjpeg-dev

      - name: Build with Clang (Debug)
        run: |
          cmake -S native-compute -B build-clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic"
          cmake --build build-clang --parallel 2

      - name: Run native grid tests
        run: ctest --test-dir build-clang --output-on-failure

      - name: Verify native parity with Clang
        env:
          PYTHONPATH: intelligence
        run: |
          python intelligence/scripts/verify_native_parity.py \
            --runner build-clang/terraflux-compute-runner \
            --fixtures intelligence/tests/fixtures/grid_spread_cases.json

  opengl-desktop:
    name: OpenGL 4.3 desktop and Xvfb smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenGL and GLFW
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev libgl-dev xvfb libpng-dev libjpeg-dev

      - name: Compile OpenGL viewer
        run: |
          cmake -S native-compute -B build-gl -DCMAKE_BUILD_TYPE=Release \
            -DTERRAFLUX_WITH_OPENGL=ON
          cmake --build build-gl --parallel 2

      - name: Run native tests with OpenGL enabled
        run: ctest --test-dir build-gl --output-on-failure

      - name: Verify owned offscreen framebuffer rendering
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a ./build-gl/terraflux-offscreen-tests

      - name: Generate wildfire scenario and native simulation frames
        run: |
          python3 examples/generate_wildfire_scenario.py > /tmp/terraflux-request.json
          ./build-gl/terraflux-compute-runner < /tmp/terraflux-request.json > /tmp/terraflux-response.json

      - name: Verify terrain height/slope shading against the CPU reference
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --terrain-shading-test --smoke-test \
            | tee /tmp/terraflux-terrain-shading.log
          grep -q "Terrain shading passed" /tmp/terraflux-terrain-shading.log
          grep -q "TERRAIN_MESH_JSON" /tmp/terraflux-terrain-shading.log
          grep -q "TERRAIN_MATERIAL_JSON" /tmp/terraflux-terrain-shading.log
          grep -q "TERRAIN_DETAIL_JSON" /tmp/terraflux-terrain-shading.log
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --terrain-shading-test --smoke-test \
            --request /tmp/terraflux-request.json --response /tmp/terraflux-response.json
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --terrain-shading-test --smoke-test \
            --offscreen --terrain-retain-frames 2 --terrain-tile-quads 8 \
            --request /tmp/terraflux-request.json --response /tmp/terraflux-response.json
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --smoke-test --terrain-contours 25 \
            --terrain-detail 0.5 --snow-line 0.6 \
            --screenshot /tmp/terraflux-contours.ppm | tee /tmp/terraflux-contours.log
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --smoke-test --terrain-contours 0 --terrain-detail 0 --snow-line 1
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --smoke-test --rock-relief 0
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --terrain-shading-test --smoke-test --render-cell 0 \
            | tee /tmp/terraflux-coarse.log
          grep -q '"refinement":1' /tmp/terraflux-coarse.log
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --terrain-shading-test --smoke-test \
            --render-cell 10 --max-render-vertices 50000 | tee /tmp/terraflux-budget-refine.log
          grep -q '"refinement":2' /tmp/terraflux-budget-refine.log
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --water-test --smoke-test --render-cell 2.5
          if ./build-gl/terraflux-terrain-viewer --max-render-vertices 10 > /tmp/terraflux-bad-budget.log 2>&1; then
            echo "tiny render vertex budget was accepted" && exit 1
          fi
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --terrain-tile-quads 8 --terrain-tile-test --smoke-test --rock-relief 12
          if ./build-gl/terraflux-terrain-viewer --rock-relief 30 > /tmp/terraflux-bad-relief.log 2>&1; then
            echo "rock relief above twenty meters was accepted" && exit 1
          fi
          grep -q "rock-relief" /tmp/terraflux-bad-relief.log
          if ./build-gl/terraflux-terrain-viewer --terrain-detail 2 > /tmp/terraflux-bad-detail.log 2>&1; then
            echo "detail strength above one was accepted" && exit 1
          fi
          grep -q "terrain-detail" /tmp/terraflux-bad-detail.log
          grep -q "Screenshot written" /tmp/terraflux-contours.log
          head -c 2 /tmp/terraflux-contours.ppm | grep -q "P6"
          if ./build-gl/terraflux-terrain-viewer --terrain-contours -1 > /tmp/terraflux-bad-contours.log 2>&1; then
            echo "negative contour interval was accepted" && exit 1
          fi
          grep -q "terrain-contours" /tmp/terraflux-bad-contours.log

      - name: Verify animated fire effects respect fuel and fire breaks
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --fire-test --smoke-test \
            --request /tmp/terraflux-request.json --response /tmp/terraflux-response.json | tee /tmp/terraflux-fire.log
          grep -q "Fire effects passed" /tmp/terraflux-fire.log
          grep -q "FIRE_EFFECTS_JSON" /tmp/terraflux-fire.log
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --fire-test --smoke-test \
            --offscreen --terrain-retain-frames 2 --terrain-tile-quads 8 \
            --request /tmp/terraflux-request.json --response /tmp/terraflux-response.json
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --fire-test --smoke-test --vegetation low --tree-style conifer \
            --flame-scale 1.5 --smoke-scale 0.5 \
            --request /tmp/terraflux-request.json --response /tmp/terraflux-response.json
          # Flooding the burning area removes its flames: water is a fire break for the visual too.
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --smoke-test --water-level 57 \
            --request /tmp/terraflux-request.json --response /tmp/terraflux-response.json | tee /tmp/terraflux-fire-water.log
          grep -q '"fuelless_samples":[1-9]' /tmp/terraflux-fire-water.log
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --smoke-test --hide-fire \
            --request /tmp/terraflux-request.json --response /tmp/terraflux-response.json | tee /tmp/terraflux-fire-hidden.log
          if grep -q "FIRE_DRAW_JSON" /tmp/terraflux-fire-hidden.log; then
            echo "fire effects drew while the fire layer was hidden" && exit 1
          fi
          if ./build-gl/terraflux-terrain-viewer --flame-scale 9 > /tmp/terraflux-bad-flame.log 2>&1; then
            echo "flame scale above three was accepted" && exit 1
          fi

      - name: Verify 3D vegetation placement, meshes, variation and run-time swaps
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --vegetation-test --smoke-test | tee /tmp/terraflux-vegetation.log
          grep -q "Vegetation passed" /tmp/terraflux-vegetation.log
          grep -q "VEGETATION_JSON" /tmp/terraflux-vegetation.log
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --vegetation-test --smoke-test \
            --offscreen --terrain-retain-frames 2 --terrain-tile-quads 8
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --vegetation-test --smoke-test \
            --vegetation high --tree-style conifer --vegetation-seed 5
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --vegetation-test --smoke-test \
            --tree-style custom --tree-obj examples/assets/pyramid_materials.obj
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --vegetation-test --smoke-test \
            --request /tmp/terraflux-request.json --response /tmp/terraflux-response.json
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --smoke-test --vegetation off | tee /tmp/terraflux-no-vegetation.log
          if grep -q "VEGETATION_DRAW_JSON" /tmp/terraflux-no-vegetation.log; then
            echo "vegetation drew while disabled" && exit 1
          fi
          if ./build-gl/terraflux-terrain-viewer --tree-style custom > /tmp/terraflux-bad-tree.log 2>&1; then
            echo "custom tree style without a model was accepted" && exit 1
          fi
          if ./build-gl/terraflux-terrain-viewer --tree-spacing 1 > /tmp/terraflux-bad-spacing.log 2>&1; then
            echo "tree spacing below four meters was accepted" && exit 1
          fi

      - name: Verify the first-person camera and the world view hand-over
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --first-person-test --smoke-test | tee /tmp/terraflux-first-person.log
          grep -q "First person passed" /tmp/terraflux-first-person.log
          grep -q '"view":"first-person"' /tmp/terraflux-first-person.log
          grep -q "CAMERA_JSON" /tmp/terraflux-first-person.log
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --first-person-test --smoke-test \
            --request /tmp/terraflux-request.json --response /tmp/terraflux-response.json
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --first-person-test --smoke-test \
            --offscreen --terrain-retain-frames 2 --terrain-tile-quads 8 --vegetation low
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --first-person-test --smoke-test --render-cell 0 --vegetation off
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --smoke-test --view first-person --walk-speed 20 \
            --view-x -350 --view-z 250 --view-yaw 20 --weather cumulus | tee /tmp/terraflux-walk.log
          grep -q '"view":"first-person"' /tmp/terraflux-walk.log
          grep -q '"walk_speed_mps":20' /tmp/terraflux-walk.log
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --smoke-test --view first-person \
            --request /tmp/terraflux-request.json --response /tmp/terraflux-response.json
          if ./build-gl/terraflux-terrain-viewer --view sideways > /tmp/terraflux-bad-view.log 2>&1; then
            echo "an unknown view was accepted" && exit 1
          fi
          if ./build-gl/terraflux-terrain-viewer --walk-speed 0.5 > /tmp/terraflux-bad-walk.log 2>&1; then
            echo "a walking speed below one meter per second was accepted" && exit 1
          fi
          if ./build-gl/terraflux-terrain-viewer --first-person-test --smoke-test --view first-person > /tmp/terraflux-bad-fp-test.log 2>&1; then
            echo "the first-person test accepted a first-person start" && exit 1
          fi

      - name: Verify walking collision with trees, cliffs and grass
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --collision-test --smoke-test | tee /tmp/terraflux-collision.log
          grep -q "Collision passed" /tmp/terraflux-collision.log
          grep -q "COLLISION_JSON" /tmp/terraflux-collision.log
          grep -q '"frame":1' /tmp/terraflux-collision.log
          if grep -q "COLLISION_TEST_NOTE" /tmp/terraflux-collision.log; then
            echo "the demo escarpment should be steep enough for the cliff check" && exit 1
          fi
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --collision-test --smoke-test \
            --request /tmp/terraflux-request.json --response /tmp/terraflux-response.json
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --collision-test --smoke-test \
            --vegetation high --tree-style broadleaf --offscreen --terrain-tile-quads 8
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --collision-test --smoke-test \
            --tree-style custom --tree-obj examples/assets/pyramid_materials.obj
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --smoke-test --view first-person --max-slope 60 \
            --scene examples/asset_scene.json | tee /tmp/terraflux-walk-assets.log
          grep -q '"max_slope_deg":60' /tmp/terraflux-walk-assets.log
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --smoke-test --view first-person --no-collision | tee /tmp/terraflux-ghost.log
          grep -q '"enabled":false' /tmp/terraflux-ghost.log
          if ./build-gl/terraflux-terrain-viewer --max-slope 95 > /tmp/terraflux-bad-slope.log 2>&1; then
            echo "a slope limit above 89 degrees was accepted" && exit 1
          fi
          if ./build-gl/terraflux-terrain-viewer --collision-test --smoke-test --no-collision > /tmp/terraflux-bad-collision-test.log 2>&1; then
            echo "the collision test accepted --no-collision" && exit 1
          fi

      - name: Verify gravity and jumping
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --jump-test --smoke-test | tee /tmp/terraflux-jump.log
          grep -q "Jump passed" /tmp/terraflux-jump.log
          grep -q '"gravity_mps2":9.81' /tmp/terraflux-jump.log
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --jump-test --smoke-test \
            --request /tmp/terraflux-request.json --response /tmp/terraflux-response.json
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --jump-test --smoke-test --gravity 1.62 --jump-height 2 \
            --offscreen --terrain-tile-quads 8 --vegetation low | tee /tmp/terraflux-moon.log
          grep -q '"gravity_mps2":1.62' /tmp/terraflux-moon.log
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --jump-test --smoke-test --vegetation off --render-cell 0
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --smoke-test --view first-person --jump-height 0 | tee /tmp/terraflux-nojump.log
          grep -q '"jump_height_m":0' /tmp/terraflux-nojump.log
          if ./build-gl/terraflux-terrain-viewer --gravity 0 > /tmp/terraflux-bad-gravity.log 2>&1; then
            echo "zero gravity was accepted" && exit 1
          fi
          if ./build-gl/terraflux-terrain-viewer --jump-test --smoke-test --jump-height 0 > /tmp/terraflux-bad-jump-test.log 2>&1; then
            echo "the jump test accepted a zero jump height" && exit 1
          fi

      - name: Verify the walking gait
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --gait-test --smoke-test | tee /tmp/terraflux-gait.log
          grep -q "Gait passed" /tmp/terraflux-gait.log
          grep -q '"gait":true' /tmp/terraflux-gait.log
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --gait-test --smoke-test \
            --request /tmp/terraflux-request.json --response /tmp/terraflux-response.json
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --gait-test --smoke-test --walk-speed 1.4 \
            --offscreen --terrain-tile-quads 8 --vegetation low
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --gait-test --smoke-test --vegetation off --render-cell 0 --walk-speed 20
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --smoke-test --view first-person --no-gait | tee /tmp/terraflux-glide.log
          grep -q '"gait":false' /tmp/terraflux-glide.log
          if ./build-gl/terraflux-terrain-viewer --gait-test --smoke-test --no-gait > /tmp/terraflux-bad-gait-test.log 2>&1; then
            echo "the gait test accepted --no-gait" && exit 1
          fi

      - name: Verify the tree-level fire
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --tree-fire-test --smoke-test \
            --request /tmp/terraflux-request.json --response /tmp/terraflux-response.json | tee /tmp/terraflux-tree-fire.log
          grep -q "Tree fire passed" /tmp/terraflux-tree-fire.log
          grep -q '"mode":"model"' /tmp/terraflux-tree-fire.log
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --tree-fire-test --smoke-test --tree-fire grid \
            --request /tmp/terraflux-request.json --response /tmp/terraflux-response.json | tee /tmp/terraflux-tree-fire-grid.log
          grep -q '"mode":"grid"' /tmp/terraflux-tree-fire-grid.log
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --tree-fire-test --smoke-test \
            --vegetation high --offscreen --terrain-tile-quads 8 \
            --request /tmp/terraflux-request.json --response /tmp/terraflux-response.json
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --smoke-test --tree-fire off \
            --request /tmp/terraflux-request.json --response /tmp/terraflux-response.json | tee /tmp/terraflux-tree-fire-off.log
          if grep -q "TREE_FIRE_JSON" /tmp/terraflux-tree-fire-off.log; then
            echo "the tree fire model ran while off" && exit 1
          fi
          if ./build-gl/terraflux-terrain-viewer --tree-fire sometimes > /tmp/terraflux-bad-tree-fire.log 2>&1; then
            echo "an unknown tree fire mode was accepted" && exit 1
          fi
          if ./build-gl/terraflux-terrain-viewer --tree-fire-test --smoke-test > /tmp/terraflux-bad-tree-fire-test.log 2>&1; then
            echo "the tree fire test ran without a replay" && exit 1
          fi

      - name: Verify storms from inside (gusts, windthrow, lightning)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --storm-test --smoke-test | tee /tmp/terraflux-storm.log
          grep -q "Storm passed" /tmp/terraflux-storm.log
          grep -q '"hazard":"struck"' /tmp/terraflux-storm.log
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --storm-test --smoke-test \
            --request /tmp/terraflux-request.json --response /tmp/terraflux-response.json
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --storm-test --smoke-test \
            --vegetation high --offscreen --terrain-tile-quads 8
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --storm-test --smoke-test --tree-fire grid --vegetation-seed 3
          if ./build-gl/terraflux-terrain-viewer --storm-test --smoke-test --weather clear > /tmp/terraflux-bad-storm.log 2>&1; then
            echo "the storm test accepted a weather override" && exit 1
          fi

      - name: Verify flash floods and the walker in water
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --flood-test --smoke-test | tee /tmp/terraflux-flood.log
          grep -q "Flood passed" /tmp/terraflux-flood.log
          grep -q "FLASH_FLOOD_JSON" /tmp/terraflux-flood.log
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --flood-test --smoke-test \
            --request /tmp/terraflux-request.json --response /tmp/terraflux-response.json
          xvfb-run -a -s "-screen 0 1280x800x24" \
            ./build-gl/terraflux-terrain-viewer --flood-test --smoke-test --offscreen --terrain-tile-quads 8 --vegetation low
          xvfb-run -a -s "-screen 0 1280x800x24" \
