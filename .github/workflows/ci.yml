          def record(path):
              line=next(s.partition("=")[2] for s in Path(path).read_text().splitlines()
                        if s.startswith("BENCHMARK_JSON="))
              return json.loads(line)
          on=record("/tmp/terraflux-benchmark-on.log")
          off=record("/tmp/terraflux-benchmark-off.log")
          assert on["culling"] is True and off["culling"] is False
          assert on["frames"]==8 and off["frames"]==8
          assert on["gpu_samples"]>0 and off["gpu_samples"]>0
          assert on["culled_per_frame"]>=75 and off["culled_per_frame"]==0
          assert on["draws_per_frame"]<off["draws_per_frame"]
          print("GPU timer and on/off comparison verified:",on,off)
          PY
