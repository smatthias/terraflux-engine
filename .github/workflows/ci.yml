            ./build-gl/terraflux-terrain-viewer --smoke-test --weather nimbostratus --temperature -3 --rainfall 40 --hour 12 \
            --time-scale 0 --view-zoom 0.03 --view-pitch 8 --view-yaw 270 --view-x 405 --view-z -234 | tee /tmp/terraflux-frozen.log
