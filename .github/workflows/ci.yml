          assert stats[-1]["headroom_bytes"]>0 and not stats[-1]["over_byte_budget"]
          assert stats[-1]["peak_total_bytes"]>=stats[-1]["total_resource_bytes"]
          PYRECOVERY
          xvfb-run -a -s "-screen 0 1280x800x24" \
